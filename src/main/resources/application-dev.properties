# ==============================================================================
# Perfil "dev": Configuración optimizada para desarrollo local en Docker
# Permite Hot Reload de plantillas Thymeleaf, LiveReload y reinicio con DevTools
# ==============================================================================

# Conexión a la base de datos PostgreSQL en contenedor Docker
spring.datasource.url=${DB_URL:jdbc:postgresql://database:5432/farmacia_aed}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway: aplica migraciones oficiales del esquema y carga datos demo de prueba
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.flyway.baseline-on-migrate=true

# Desactivar caché de Thymeleaf y cargar plantillas directamente desde disco para cambios instantáneos
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/

# Servir recursos estáticos (CSS compilado por Tailwind, JS e imágenes) directamente desde src
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.chain.cache=false
spring.web.resources.cache.period=0

# Spring Boot DevTools: Reinicio coordinado con la compilación incremental de Maven
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
spring.devtools.restart.trigger-file=.reloadtrigger
spring.devtools.restart.additional-paths=src/main/resources
spring.devtools.livereload.enabled=true

# Logging específico para observar reinicios y migraciones
logging.level.com.farmacia=INFO
logging.level.org.springframework.boot.devtools=INFO
logging.level.org.flywaydb=INFO
