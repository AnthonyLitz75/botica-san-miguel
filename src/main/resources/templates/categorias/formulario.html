<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: recursos(${esEdicion ? 'Editar Categoría' : 'Nueva Categoría'})}">
    <title th:text="${esEdicion ? 'Editar Categoría' : 'Nueva Categoría'} + ' | Botica San Miguel'">Categoría</title>
</head>
<body class="pagina-inventario">
    <a class="saltar-contenido" href="#contenido">Ir al contenido</a>
    <aside th:replace="~{fragmentos/navegacion :: lateral('Categorías')}"></aside>
    <div class="inventario-area">
        <header th:replace="~{fragmentos/navegacion :: cabecera('Categorías', ${esEdicion ? 'Modificar nodo de taxonomía' : 'Registrar nueva categoría en el árbol'})}"></header>
        <main id="contenido" class="inventario-contenido">
            <div class="inventario-titulo">
                <div>
                    <p class="seccion-etiqueta">CATÁLOGO / TAXONOMÍA</p>
                    <h1 th:text="${esEdicion ? 'Editar Categoría' : 'Nueva Categoría'}">Nueva Categoría</h1>
                    <p class="clientes-intro" th:text="${esEdicion ? 'Actualiza el nombre o reubica la categoría en otro nodo padre sin generar ciclos.' : 'Ingresa el nombre y selecciona el nodo padre para insertarla en el árbol n-ario.'}">
                        Formulario de categoría
                    </p>
                </div>
                <a class="inventario-boton boton-secundario transition-all duration-150 active:scale-95" th:href="@{/categorias}">
                    <span class="icono icono-arrow-left" aria-hidden="true"></span>Volver al árbol
                </a>
            </div>

            <div class="aviso-operacion aviso-error shadow-sm" th:if="${errorNegocio != null}" role="alert">
                <span class="icono icono-alert-circle" aria-hidden="true"></span>
                <span th:text="${errorNegocio}"></span>
            </div>

            <div class="formulario-card max-w-xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <form th:action="${esEdicion ? '/categorias/' + categoriaId + '/editar' : '/categorias/nueva'}"
                      th:object="${formulario}"
                      method="post"
                      class="space-y-5"
                      novalidate>

                    <div>
                        <label for="nombre" class="block text-sm font-semibold text-slate-700 mb-1">Nombre de la categoría <span class="text-red-500">*</span></label>
                        <input type="text"
                               id="nombre"
                               th:field="*{nombre}"
                               maxlength="100"
                               placeholder="Ej. Analgésicos, AINEs, Antibióticos"
                               class="w-full px-3.5 py-2.5 rounded-lg border text-sm transition-all focus:outline-none focus:ring-2 focus:ring-emerald-600/30"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'border-red-500 ring-2 ring-red-100' : 'border-slate-300 focus:border-emerald-600'"
                               required>
                        <p class="mt-1 text-xs text-red-600 font-medium" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error en nombre</p>
                    </div>

                    <div>
                        <label for="idPadre" class="block text-sm font-semibold text-slate-700 mb-1">Categoría padre (opcional)</label>
                        <select id="idPadre"
                                th:field="*{idPadre}"
                                class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm bg-white transition-all focus:outline-none focus:ring-2 focus:ring-emerald-600/30 focus:border-emerald-600">
                            <option value="">— Ninguna (Categoría raíz / Nivel superior) —</option>
                            <option th:each="padre : ${padresDisponibles}"
                                    th:value="${padre.idCategoria()}"
                                    th:text="${padre.nombre()}">Categoría</option>
                        </select>
                        <p class="mt-1 text-xs text-slate-500">
                            Dejar vacío si esta categoría representa un grupo principal en la raíz del árbol.
                        </p>
                    </div>

                    <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                        <a th:href="@{/categorias}" class="inventario-boton boton-secundario transition-all duration-150 active:scale-95">
                            Cancelar
                        </a>
                        <button type="submit" class="inventario-boton boton-principal transition-all duration-150 active:scale-95 hover:shadow-md">
                            <span class="icono icono-check" aria-hidden="true"></span>
                            <span th:text="${esEdicion ? 'Actualizar categoría' : 'Guardar categoría'}">Guardar</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
