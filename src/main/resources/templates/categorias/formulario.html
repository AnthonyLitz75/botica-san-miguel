<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: recursos(${esEdicion ? 'Editar Categoría' : 'Nueva Categoría'})}">
    <title th:text="${esEdicion ? 'Editar Categoría' : 'Nueva Categoría'} + ' | Botica San Miguel'">Categoría</title>
</head>

<body class="pagina-inventario">
    <a class="saltar-contenido" href="#contenido">Ir al contenido</a>
    <aside th:replace="~{fragmentos/navegacion :: lateral('Categorías')}"></aside>
    <div class="inventario-area">
        <header th:replace="~{fragmentos/navegacion :: cabecera('Categorías', ${esEdicion ? 'Modificar nodo de taxonomía' : 'Registrar nueva categoría en el árbol'})}"></header>
        <main id="contenido" class="page inventario-contenido">
            <div class="head">
                <div>
                    <div class="eyebrow">CATÁLOGO / TAXONOMÍA</div>
                    <h1 class="text-3xl font-extrabold tracking-tight text-ink" th:text="${esEdicion ? 'Editar Categoría' : 'Nueva Categoría'}">Nueva Categoría</h1>
                    <div class="sub" th:text="${esEdicion ? 'Actualiza el nombre o reubica la categoría en otro nodo padre sin generar ciclos.' : 'Ingresa el nombre y selecciona el nodo padre para insertarla en el árbol n-ario.'}">
                        Formulario de categoría
                    </div>
                </div>
                <div class="row" style="align-items:center">
                    <a class="btn s inventario-boton boton-secundario" th:href="@{/categorias}">
                        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                        Volver al árbol
                    </a>
                </div>
            </div>

            <div class="card pad mb-6 bg-rose-bg border-rose/30 text-rose aviso-operacion aviso-error flex items-center gap-2" th:if="${errorNegocio != null}" role="alert">
                <svg class="ico text-rose" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span th:text="${errorNegocio}"></span>
            </div>

            <div class="max-w-2xl">
                <form th:action="${esEdicion ? '/categorias/' + categoriaId + '/editar' : '/categorias/nueva'}"
                      th:object="${formulario}"
                      method="post"
                      class="card overflow-hidden"
                      novalidate>

                    <div class="mh flex items-start gap-3.5 p-6 border-b border-line">
                        <div class="fi2 w-11 h-11 rounded-xl bg-pine-50 text-pine-700 grid place-items-center flex-none">
                            <svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-ink" th:text="${esEdicion ? 'Ficha de Categoría' : 'Nueva Categoría en el Árbol'}">Nueva Categoría</h2>
                            <p class="text-xs text-ink-3 mt-0.5">Define la posición taxonómica dentro de la estructura N-aria.</p>
                        </div>
                    </div>

                    <div class="p-6 space-y-4">
                        <div>
                            <label for="nombre" class="text-xs font-bold text-ink-2 mb-1.5 block">Nombre de la categoría <span class="text-rose">*</span></label>
                            <div class="inp" th:classappend="${#fields.hasErrors('nombre')} ? 'err' : ''">
                                <input type="text"
                                       id="nombre"
                                       th:field="*{nombre}"
                                       maxlength="100"
                                       placeholder="Ej. Analgésicos, AINEs, Antibióticos"
                                       class="w-full bg-transparent border-0 outline-none text-ink text-sm font-semibold"
                                       required>
                            </div>
                            <p class="help e mt-1 text-xs text-rose font-medium" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error en nombre</p>
                        </div>

                        <div>
                            <label for="idPadre" class="text-xs font-bold text-ink-2 mb-1.5 block">Categoría padre (opcional)</label>
                            <div class="inp">
                                <select id="idPadre"
                                        th:field="*{idPadre}"
                                        class="w-full bg-transparent border-0 outline-none text-ink text-sm font-semibold cursor-pointer">
                                    <option value="">— Ninguna (Categoría raíz / Nivel superior) —</option>
                                    <option th:each="padre : ${padresDisponibles}"
                                            th:value="${padre.idCategoria()}"
                                            th:text="${padre.nombre()}">Categoría</option>
                                </select>
                            </div>
                            <span class="text-xs text-ink-3 mt-1.5 block">
                                Déjalo vacío si esta categoría representa un grupo principal en la raíz del árbol.
                            </span>
                        </div>
                    </div>

                    <div class="mf flex justify-end gap-3 p-6 bg-slate-50 border-t border-line">
                        <a th:href="@{/categorias}" class="btn s inventario-boton boton-secundario">
                            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                            Cancelar
                        </a>
                        <button type="submit" class="btn p inventario-boton boton-principal">
                            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                            <span th:text="${esEdicion ? 'Actualizar categoría' : 'Guardar categoría'}">Guardar</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
