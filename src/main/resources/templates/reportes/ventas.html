<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: recursos('Ventas por período')}">
    <title>Ventas por período | Botica San Miguel</title>
</head>

<body class="pagina-inventario">
    <a class="saltar-contenido" href="#contenido">Ir al contenido</a>
    <aside th:replace="~{fragmentos/navegacion :: lateral('Reportes')}"></aside>
    <div class="inventario-area">
        <header th:replace="~{fragmentos/navegacion :: cabecera('Ventas por período', 'Reportes')}"></header>
        <main id="contenido" class="inventario-contenido">

            <div th:replace="~{fragmentos/reportes :: cabecera('Ventas por período', 'Consolidado diario de ventas, subtotales, descuentos aplicados e importes netos.', @{/reportes/ventas.csv(desde=${filtro.desde()}, hasta=${filtro.hasta()})})}"></div>

            <!-- Subnavegación de reportes unificada -->
            <div th:replace="~{fragmentos/reportes :: pestanas('ventas')}"></div>

            <div class="aviso-operacion aviso-error shadow-sm mb-4" th:if="${error != null}" role="alert">
                <span class="icono icono-circle-alert" aria-hidden="true"></span>
                <span th:text="${error}">Error en los filtros.</span>
            </div>

            <!-- KPIs de Totales -->
            <div class="kpis" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));">
                <div th:replace="~{fragmentos/reportes :: kpi('recaudado', 't-ok', 'Total recaudado', ${'S/ ' + #numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}, ${totalVentas + (totalVentas == 1 ? ' venta en el rango' : ' ventas en el rango')}, null)}"></div>
                <div th:replace="~{fragmentos/reportes :: kpi('subtotal', 't-blue', 'Subtotal', ${'S/ ' + #numbers.formatDecimal(subtotal, 1, 'COMMA', 2, 'POINT')}, 'Antes de descuentos', null)}"></div>
                <div th:replace="~{fragmentos/reportes :: kpi('descuentos', 't-amber', 'Descuentos', ${'S/ ' + #numbers.formatDecimal(descuento, 1, 'COMMA', 2, 'POINT')}, 'Rebajas aplicadas', 'text-rose-600')}"></div>
            </div>

            <!-- Filtros de fecha -->
            <div class="card pad mb-6">
                <form th:action="@{/reportes/ventas}" method="get" role="search" aria-label="Filtro de fechas">
                    <div class="flex items-end gap-4 flex-wrap">
                        <div class="w-full sm:w-[230px]">
                            <label for="desde">Desde</label>
                            <div class="inp">
                                <svg class="ico text-ink-3 flex-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
                                </svg>
                                <input type="date" id="desde" name="desde" th:value="${filtro.desde()}" class="w-full bg-transparent border-0 focus:outline-none text-ink font-semibold">
                            </div>
                        </div>
                        <div class="w-full sm:w-[230px]">
                            <label for="hasta">Hasta</label>
                            <div class="inp">
                                <svg class="ico text-ink-3 flex-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
                                </svg>
                                <input type="date" id="hasta" name="hasta" th:value="${filtro.hasta()}" class="w-full bg-transparent border-0 focus:outline-none text-ink font-semibold">
                            </div>
                        </div>
                        <div>
                            <button type="submit" class="btn p" style="height:42px;">
                                <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <path d="M22 3H2l8 9.46V19l4 2v-8.54z"/>
                                </svg>
                                <span>Filtrar</span>
                            </button>
                        </div>
                        <div class="sp flex-1"></div>
                        <span class="lbl self-center text-xs text-ink-3 font-semibold pb-1"
                              th:text="${diasRango != null ? 'Últimos ' + diasRango + ' días' : 'Últimos 30 días'}">Últimos 30 días</span>
                    </div>
                </form>
            </div>

            <!-- Gráfico de ventas netas por día o aviso (Spec 021, Boceto 07) -->
            <div th:replace="~{fragmentos/grafico-barras :: grafico(barras=${barras}, resumen=${resumenGrafico}, maximo=${maximoDia}, aviso=${avisoGrafico})}"></div>

            <!-- Tabla de datos -->
            <div class="sec">
                <h2>Detalle consolidado por día</h2>
                <span class="cnt" th:text="${#lists.size(reporte)}">0</span>
            </div>

            <div class="card overflow-hidden">
                <div class="overflow-x-auto">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Fecha</th>
                                <th scope="col" class="c">N.º Ventas</th>
                                <th scope="col" class="r">Subtotal</th>
                                <th scope="col" class="r">Descuento</th>
                                <th scope="col" class="r">Total neto</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(reporte)}">
                                <td colspan="5" class="text-center py-12 text-ink-3">
                                    <svg class="mx-auto text-slate-300 mb-2" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                        <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
                                    </svg>
                                    <p class="text-sm font-semibold text-ink-2">No se registraron ventas en el rango de fechas seleccionado.</p>
                                </td>
                            </tr>
                            <tr th:each="fila : ${reporte}">
                                <td class="font-medium text-ink" th:text="${#temporals.format(fila.fecha(), 'dd/MM/yyyy')}">01/01/2026</td>
                                <td class="c font-bold text-ink-2" th:text="${fila.cantidadVentas()}">1</td>
                                <td class="r text-xs text-ink-3" th:text="${'S/ ' + #numbers.formatDecimal(fila.subtotal(), 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td>
                                <td class="r text-xs">
                                    <span th:if="${fila.descuento() != null and fila.descuento().compareTo(T(java.math.BigDecimal).ZERO) > 0}" class="text-rose-600"
                                          th:text="${'S/ ' + #numbers.formatDecimal(fila.descuento(), 1, 'COMMA', 2, 'POINT')}">S/ 0.00</span>
                                    <span th:unless="${fila.descuento() != null and fila.descuento().compareTo(T(java.math.BigDecimal).ZERO) > 0}" class="text-ink-3">—</span>
                                </td>
                                <td class="r font-bold text-pine-800" th:text="${'S/ ' + #numbers.formatDecimal(fila.total(), 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td>
                            </tr>
                        </tbody>
                        <tfoot th:if="${not #lists.isEmpty(reporte)}" class="bg-slate-50 font-bold border-t-2 border-line">
                            <tr>
                                <td class="font-bold text-ink">TOTAL GENERAL</td>
                                <td class="c font-bold text-ink" th:text="${totalVentas}">0</td>
                                <td class="r font-bold text-ink-3" th:text="${'S/ ' + #numbers.formatDecimal(subtotal, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td>
                                <td class="r font-bold text-xs">
                                    <span th:if="${descuento != null and descuento.compareTo(T(java.math.BigDecimal).ZERO) > 0}" class="text-rose-600"
                                          th:text="${'S/ ' + #numbers.formatDecimal(descuento, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</span>
                                    <span th:unless="${descuento != null and descuento.compareTo(T(java.math.BigDecimal).ZERO) > 0}" class="text-ink-3">—</span>
                                </td>
                                <td class="r font-extrabold text-pine-800 text-base" th:text="${'S/ ' + #numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
