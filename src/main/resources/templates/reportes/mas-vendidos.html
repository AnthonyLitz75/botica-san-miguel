<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: recursos('Medicamentos más vendidos')}">
    <title>Medicamentos más vendidos | Botica San Miguel</title>
</head>

<body class="pagina-inventario">
    <a class="saltar-contenido" href="#contenido">Ir al contenido</a>
    <aside th:replace="~{fragmentos/navegacion :: lateral('Reportes')}"></aside>
    <div class="inventario-area">
        <header th:replace="~{fragmentos/navegacion :: cabecera('Medicamentos más vendidos', 'Reportes')}"></header>
        <main id="contenido" class="inventario-contenido">

            <div th:replace="~{fragmentos/reportes :: cabecera('Medicamentos más vendidos', 'Ranking de rotación de productos por volumen de unidades vendidas e importe recaudado.', @{/reportes/mas-vendidos.csv(desde=${filtro.desde()}, hasta=${filtro.hasta()}, limite=${filtro.limite()})})}"></div>

            <!-- Subnavegación de reportes unificada -->
            <div th:replace="~{fragmentos/reportes :: pestanas('mas-vendidos')}"></div>

            <div class="aviso-operacion aviso-error shadow-sm mb-4" th:if="${error != null}" role="alert">
                <span class="icono icono-circle-alert" aria-hidden="true"></span>
                <span th:text="${error}">Error en los filtros.</span>
            </div>

            <!-- KPIs de Totales -->
            <div class="kpis" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));">
                <div th:replace="~{fragmentos/reportes :: kpi('unidades', 't-blue', 'Unidades del ranking', ${totalUnidades}, 'Unidades vendidas', null)}"></div>
                <div th:replace="~{fragmentos/reportes :: kpi('recaudado', 't-ok', 'Recaudación del ranking', ${'S/ ' + #numbers.formatDecimal(totalVendido, 1, 'COMMA', 2, 'POINT')}, 'Total generado', null)}"></div>
            </div>

            <!-- Filtros del reporte -->
            <div class="card pad mb-6">
                <form th:action="@{/reportes/mas-vendidos}" method="get" role="search" aria-label="Filtro del reporte">
                    <div class="flex items-end gap-4 flex-wrap">
                        <div class="w-full sm:w-[230px]">
                            <label for="desde">Desde</label>
                            <div class="inp">
                                <svg class="ico text-ink-3 flex-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
                                </svg>
                                <input type="date" id="desde" name="desde" th:value="${filtro.desde()}" class="w-full bg-transparent border-0 focus:outline-none text-ink font-semibold">
                            </div>
                        </div>
                        <div class="w-full sm:w-[230px]">
                            <label for="hasta">Hasta</label>
                            <div class="inp">
                                <svg class="ico text-ink-3 flex-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
                                </svg>
                                <input type="date" id="hasta" name="hasta" th:value="${filtro.hasta()}" class="w-full bg-transparent border-0 focus:outline-none text-ink font-semibold">
                            </div>
                        </div>
                        <div class="w-full sm:w-[200px]">
                            <label for="limite">Límite de productos</label>
                            <div class="inp">
                                <select id="limite" name="limite" class="w-full bg-transparent border-0 focus:outline-none text-ink font-semibold" style="height:42px;">
                                    <option value="5" th:selected="${filtro.limite() == 5}">Top 5</option>
                                    <option value="10" th:selected="${filtro.limite() == 10 || filtro.limite() == null}">Top 10</option>
                                    <option value="20" th:selected="${filtro.limite() == 20}">Top 20</option>
                                    <option value="50" th:selected="${filtro.limite() == 50}">Top 50</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <button type="submit" class="btn p" style="height:42px;">
                                <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <path d="M22 3H2l8 9.46V19l4 2v-8.54z"/>
                                </svg>
                                <span>Filtrar</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Tabla de datos -->
            <div class="sec">
                <h2>Ranking de medicamentos más vendidos</h2>
                <span class="cnt" th:text="${#lists.size(reporte)}">0</span>
            </div>

            <div class="card overflow-hidden">
                <div class="overflow-x-auto" tabindex="0" role="region" aria-label="Tabla de productos más vendidos">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col" class="c w-12">#</th>
                                <th scope="col">Código</th>
                                <th scope="col">Medicamento</th>
                                <th scope="col" class="r">Unidades vendidas</th>
                                <th scope="col" class="r">Importe total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(reporte)}">
                                <td colspan="5" class="text-center py-12 text-ink-3">
                                    <svg class="mx-auto text-slate-300 mb-2" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                        <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
                                    </svg>
                                    <p class="text-sm font-semibold text-ink-2">No se encontraron ventas para los criterios seleccionados.</p>
                                </td>
                            </tr>
                            <tr th:each="item, stat : ${reporte}">
                                <td class="c text-xs text-ink-3 font-semibold" th:text="${stat.count}">1</td>
                                <td class="font-mono text-xs font-semibold text-ink" th:text="${item.codigo()}">PAR-01</td>
                                <td class="font-medium text-ink" th:text="${item.nombre()}">Paracetamol 500mg</td>
                                <td class="r font-bold text-ink-2" th:text="${item.unidadesVendidas()}">45</td>
                                <td class="r font-bold text-pine-800" th:text="${'S/ ' + #numbers.formatDecimal(item.totalVendido(), 1, 'COMMA', 2, 'POINT')}">S/ 90.00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
