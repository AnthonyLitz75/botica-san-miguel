<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: recursos('Panel resumen')}">
    <title>Panel resumen | Botica San Miguel</title>
</head>

<body class="pagina-inventario">
    <a class="saltar-contenido" href="#contenido">Ir al contenido</a>
    <aside th:replace="~{fragmentos/navegacion :: lateral('Reportes')}"></aside>
    <div class="inventario-area">
        <header th:replace="~{fragmentos/navegacion :: cabecera('Panel resumen', 'Reportes')}"></header>
        <main id="contenido" class="inventario-contenido">

            <div th:replace="~{fragmentos/reportes :: cabecera('Panel resumen', 'Indicadores clave de rendimiento comercial y estado crítico de existencias para la administración.', null)}"></div>

            <!-- Subnavegación de reportes unificada -->
            <div th:replace="~{fragmentos/reportes :: pestanas('panel')}"></div>

            <div th:if="${resumen != null}">
                <!-- KPIs de rendimiento y alertas -->
                <div class="kpis" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));">
                    <div th:replace="~{fragmentos/reportes :: kpi('chart', 't-ok', 'Ventas del mes', ${'S/ ' + #numbers.formatDecimal(resumen.totalMes(), 1, 'COMMA', 2, 'POINT')}, ${resumen.cantidadVentasMes() + ' ventas'}, null)}"></div>
                    <div th:replace="~{fragmentos/reportes :: kpi('tarjeta', 't-blue', 'Ticket promedio', ${'S/ ' + #numbers.formatDecimal(resumen.ticketPromedio(), 1, 'COMMA', 2, 'POINT')}, 'Mes en curso', null)}"></div>
                    <div th:replace="~{fragmentos/reportes :: kpi('paquete', 't-rose', 'Alertas de Stock', ${resumen.medicamentosAlertaStock()}, 'Bajo stock mínimo o agotados', 'text-rose-600')}"></div>
                    <div th:replace="~{fragmentos/reportes :: kpi('reloj', 't-amber', 'Vencimientos próximos', ${resumen.lotesPorVencer()}, ${'Lotes a vencer en ' + resumen.diasPorVencer() + ' días'}, 'text-amber-600')}"></div>
                </div>

                <!-- Tarjeta verde de descarga / accesos directos a reportes -->
                <div class="card pad mt-4" style="background: linear-gradient(135deg, #143a31, #0f2a24); color: #fff; border-radius: 16px;">
                    <h2 class="text-base font-bold mb-1 text-white">Reportes detallados para la toma de decisiones</h2>
                    <p class="text-xs text-emerald-100 mb-4">Descarga los reportes en CSV para abrirlos en Excel.</p>
                    <div class="flex flex-wrap gap-2 text-xs">
                        <a th:href="@{/reportes/ventas}" class="btn s text-xs py-2 px-3.5" style="background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.25);">Ventas por período</a>
                        <a th:href="@{/reportes/mas-vendidos}" class="btn s text-xs py-2 px-3.5" style="background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.25);">Más vendidos</a>
                        <a th:href="@{/reportes/mermas}" class="btn s text-xs py-2 px-3.5" style="background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.25);">Mermas y bajas</a>
                    </div>
                </div>
            </div>

        </main>
    </div>
</body>

</html>
