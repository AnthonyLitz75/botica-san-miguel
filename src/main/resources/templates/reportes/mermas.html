<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: recursos('Mermas y bajas')}">
    <title>Mermas y bajas | Botica San Miguel</title>
</head>

<body class="pagina-inventario">
    <a class="saltar-contenido" href="#contenido">Ir al contenido</a>
    <aside th:replace="~{fragmentos/navegacion :: lateral('Reportes')}"></aside>
    <div class="inventario-area">
        <header th:replace="~{fragmentos/navegacion :: cabecera('Mermas y bajas', 'Reportes')}"></header>
        <main id="contenido" class="inventario-contenido">

            <div th:replace="~{fragmentos/reportes :: cabecera('Mermas y bajas', 'Descargas no operativas por deterioro, vencimiento o rotura.', @{/reportes/mermas.csv(desde=${filtro.desde()}, hasta=${filtro.hasta()})})}"></div>

            <!-- Subnavegación de reportes unificada -->
            <div th:replace="~{fragmentos/reportes :: pestanas('mermas')}"></div>

            <div class="aviso-operacion aviso-error shadow-sm mb-4" th:if="${error != null}" role="alert">
                <span class="icono icono-circle-alert" aria-hidden="true"></span>
                <span th:text="${error}">Error en los filtros.</span>
            </div>

            <!-- KPIs de Totales -->
            <div class="kpis" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));">
                <div th:replace="~{fragmentos/reportes :: kpi('baja', 't-rose', 'Total unidades de baja', ${totalUnidades}, 'Descargas no operativas', null)}"></div>
            </div>

            <!-- Filtros de fecha -->
            <div class="card pad mb-6">
                <form th:action="@{/reportes/mermas}" method="get" role="search" aria-label="Filtro de fechas">
                    <div class="flex items-end gap-4 flex-wrap">
                        <div class="w-full sm:w-[230px]">
                            <label for="desde">Desde</label>
                            <div class="inp">
                                <svg class="ico text-ink-3 flex-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
                                </svg>
                                <input type="date" id="desde" name="desde" th:value="${filtro.desde()}" class="w-full bg-transparent border-0 focus:outline-none text-ink font-semibold">
                            </div>
                        </div>
                        <div class="w-full sm:w-[230px]">
                            <label for="hasta">Hasta</label>
                            <div class="inp">
                                <svg class="ico text-ink-3 flex-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
                                </svg>
                                <input type="date" id="hasta" name="hasta" th:value="${filtro.hasta()}" class="w-full bg-transparent border-0 focus:outline-none text-ink font-semibold">
                            </div>
                        </div>
                        <div>
                            <button type="submit" class="btn p" style="height:42px;">
                                <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <path d="M22 3H2l8 9.46V19l4 2v-8.54z"/>
                                </svg>
                                <span>Filtrar</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Tabla de datos -->
            <div class="sec">
                <h2>Listado de mermas por medicamento</h2>
                <span class="cnt" th:text="${#lists.size(reporte)}">0</span>
            </div>

            <div class="card overflow-hidden">
                <div class="overflow-x-auto" tabindex="0" role="region" aria-label="Tabla de mermas y bajas de inventario">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col" class="c w-12">#</th>
                                <th scope="col">Código</th>
                                <th scope="col">Medicamento</th>
                                <th scope="col" class="r">Unidades dadas de baja</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(reporte)}">
                                <td colspan="4" class="text-center py-12 text-ink-3">
                                    <svg class="mx-auto text-slate-300 mb-2" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                        <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
                                    </svg>
                                    <p class="text-sm font-semibold text-ink-2">No se registraron mermas ni bajas en el rango de fechas seleccionado.</p>
                                </td>
                            </tr>
                            <tr th:each="m, stat : ${reporte}">
                                <td class="c text-xs text-ink-3 font-semibold" th:text="${stat.count}">1</td>
                                <td class="font-mono text-xs font-semibold text-ink" th:text="${m.codigo()}">IBU-01</td>
                                <td class="font-medium text-ink" th:text="${m.nombre()}">Ibuprofeno 400mg</td>
                                <td class="r font-bold text-rose-600" th:text="${m.unidadesBaja()}">12</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
