<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <nav th:fragment="menu(seccion)" class="inventario-nav" aria-label="Secciones">
        <a th:href="@{/medicamentos}" th:attr="aria-current=${seccion == 'Medicamentos' ? 'page' : null}">
            <span class="icono icono-pill" aria-hidden="true"></span>
            <span>Medicamentos</span>
        </a>
        <a th:if="${puedeConsultarAlertas}" th:href="@{/alertas}"
            th:attr="aria-current=${seccion == 'Alertas' ? 'page' : null}">
            <span class="icono icono-package" aria-hidden="true"></span>
            <span>Alertas</span>
        </a>
        <a th:if="${puedeConsultarClientes}" th:href="@{/clientes}"
            th:attr="aria-current=${seccion == 'Clientes' ? 'page' : null}">
            <span class="icono icono-user-round" aria-hidden="true"></span>
            <span>Clientes</span>
        </a>
        <a th:if="${puedeConsultarProveedores}" th:href="@{/proveedores}"
            th:attr="aria-current=${seccion == 'Proveedores' ? 'page' : null}">
            <span class="icono icono-truck" aria-hidden="true"></span>
            <span>Proveedores</span>
        </a>
        <a th:if="${puedeConsultarOrdenesCompra}" th:href="@{/ordenes-compra}"
            th:attr="aria-current=${seccion == 'Órdenes de compra' ? 'page' : null}">
            <span class="icono icono-clipboard-list" aria-hidden="true"></span>
            <span>Órdenes de compra</span>
        </a>
        <a th:if="${puedeConsultarMovimientos}" th:href="@{/movimientos}"
            th:attr="aria-current=${seccion == 'Movimientos' ? 'page' : null}">
            <span class="icono icono-arrow-left-right" aria-hidden="true"></span>
            <span>Movimientos</span>
        </a>
    </nav>

    <aside th:fragment="lateral(seccion)" class="inventario-lateral" aria-label="Navegación principal">
        <a class="inventario-marca" th:href="@{/medicamentos}">
            <img th:src="@{/images/logo-botica-san-miguel.png}" width="44" height="44" alt="">
            <div>
                <span class="marca-subtitulo">BOTICA</span>
                <span class="marca-nombre">San Miguel</span>
            </div>
        </a>
        <p class="nav-titulo">MÓDULOS DE GESTIÓN</p>
        <nav th:replace="~{fragmentos/navegacion :: menu(${seccion})}"></nav>
        <div class="lateral-pie">
            <span class="punto-activo" aria-hidden="true"></span>
            <span>Sistema de Inventario</span>
        </div>
    </aside>

    <header th:fragment="cabecera(seccion, area)" class="inventario-cabecera">
        <details class="menu-movil">
            <summary title="Abrir o cerrar navegación" aria-label="Abrir o cerrar navegación">
                <span class="icono icono-menu" aria-hidden="true"></span>
            </summary>
            <nav th:replace="~{fragmentos/navegacion :: menu(${seccion})}"></nav>
        </details>

        <div class="cabecera-seccion">
            <span class="cabecera-area-badge">
                <span class="icono icono-package" aria-hidden="true"></span>
                <span th:text="${area}"></span>
            </span>
            <span class="cabecera-separador" aria-hidden="true">/</span>
            <strong th:text="${seccion}"></strong>
        </div>

        <div class="cabecera-cuenta">
            <div class="usuario-capsula">
                <span class="usuario-avatar">
                    <span class="icono icono-user-round" aria-hidden="true"></span>
                </span>
                <div class="usuario-datos">
                    <strong th:text="${nombreUsuario}"></strong>
                    <span class="usuario-rol-badge" th:text="${rolUsuario}"></span>
                </div>
            </div>
            <span class="cuenta-divisor" aria-hidden="true"></span>
            <form th:action="@{/logout}" method="post">
                <button class="boton-icono cerrar-sesion" type="submit" title="Cerrar sesión"
                    aria-label="Cerrar sesión">
                    <span class="icono icono-log-out" aria-hidden="true"></span>
                </button>
            </form>
        </div>
    </header>
</body>

</html>
