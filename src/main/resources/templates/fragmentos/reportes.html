<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fragmentos Reportes | Botica San Miguel</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo-botica-san-miguel-256.png}">
</head>
<body>

    <!-- (a) Cabecera de reporte: etiqueta superior, título, subtítulo y botón Exportar CSV a la derecha -->
    <div th:fragment="cabecera(titulo, subtitulo, csvUrl)" class="head">
        <div>
            <div class="eyebrow">REPORTES / GESTIÓN</div>
            <h1 th:text="${titulo}">Reporte</h1>
            <div class="sub" th:text="${subtitulo}">Descripción del reporte.</div>
        </div>
        <div class="flex items-center gap-3" th:if="${csvUrl != null}">
            <a th:href="${csvUrl}" class="btn s">
                <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>
                </svg>
                <span>Exportar CSV</span>
            </a>
        </div>
    </div>

    <!-- (b) Subnavegación de reportes: pestañas unificadas -->
    <div th:fragment="pestanas(activa)" class="flex items-center gap-2 mb-6 flex-wrap">
        <a th:href="@{/reportes/ventas}" class="btn text-xs py-2 px-3.5" th:classappend="${activa == 'ventas' ? 'p' : 's'}">Ventas por período</a>
        <a th:href="@{/reportes/mas-vendidos}" class="btn text-xs py-2 px-3.5" th:classappend="${activa == 'mas-vendidos' ? 'p' : 's'}">Más vendidos</a>
        <a th:href="@{/reportes/mermas}" class="btn text-xs py-2 px-3.5" th:classappend="${activa == 'mermas' ? 'p' : 's'}">Mermas y bajas</a>
        <a th:href="@{/reportes/inventario}" class="btn text-xs py-2 px-3.5" th:classappend="${activa == 'inventario' ? 'p' : 's'}">Inventario</a>
        <a th:href="@{/reportes/compras}" class="btn text-xs py-2 px-3.5" th:classappend="${activa == 'compras' ? 'p' : 's'}">Estado de compras</a>
        <a th:href="@{/reportes/panel}" class="btn text-xs py-2 px-3.5" th:classappend="${activa == 'panel' ? 'p' : 's'}">Panel resumen</a>
    </div>

    <!-- (c) Tarjeta KPI unificada -->
    <div th:fragment="kpi(iconoTipo, claseIcono, etiqueta, valor, nota, claseValor)" class="card kpi">
        <div class="ic" th:classappend="${claseIcono != null ? claseIcono : 't-ok'}">
            <!-- Icono según iconoTipo -->
            <svg th:if="${iconoTipo == 'recaudado' or iconoTipo == 'dinero'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>
            </svg>
            <svg th:if="${iconoTipo == 'subtotal' or iconoTipo == 'recibo'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>
            </svg>
            <svg th:if="${iconoTipo == 'descuentos' or iconoTipo == 'filtro'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M22 3H2l8 9.46V19l4 2v-8.54z"/>
            </svg>
            <svg th:if="${iconoTipo == 'paquete' or iconoTipo == 'unidades' or iconoTipo == 'inventario'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>
            </svg>
            <svg th:if="${iconoTipo == 'baja' or iconoTipo == 'merma'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <svg th:if="${iconoTipo == 'alerta'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <svg th:if="${iconoTipo == 'reloj' or iconoTipo == 'vencimiento'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <svg th:if="${iconoTipo == 'ordenes' or iconoTipo == 'compras'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>
            </svg>
            <svg th:if="${iconoTipo == 'check' or iconoTipo == 'recibida'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
            </svg>
            <svg th:if="${iconoTipo == 'cancelada' or iconoTipo == 'x'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <svg th:if="${iconoTipo == 'chart' or iconoTipo == 'grafico'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>
            </svg>
            <svg th:if="${iconoTipo == 'tarjeta' or iconoTipo == 'credit-card'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>
            </svg>
            <svg th:if="${iconoTipo == 'camion' or iconoTipo == 'proveedor'}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>
            </svg>
        </div>
        <div>
            <div class="t" th:text="${etiqueta}">Etiqueta</div>
            <div class="n" th:classappend="${claseValor}" style="white-space: nowrap;" th:text="${valor}">0</div>
            <div class="d" th:text="${nota}">Nota</div>
        </div>
    </div>

</body>
</html>
