<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragmento principal de paginación para listados largos (Spec 023) -->
<div th:fragment="control(p)" th:if="${p != null and p.total() > 0}"
     class="paginacion-contenedor flex flex-col sm:flex-row items-center justify-between gap-3 px-4 py-3 border-t border-line">
    <!-- Texto informativo debajo de la tabla (a la izquierda en escritorio, centrado arriba en móvil) -->
    <div class="lbl resultados-pie text-xs sm:text-sm text-ink-3 font-medium text-center sm:text-left flex-none"
         th:text="|Mostrando ${p.desde()}–${p.hasta()} de ${p.total()}|">
        Mostrando 1–25 de 212
    </div>

    <!-- Navegación de páginas (a la derecha en escritorio, abajo en móvil) -->
    <nav th:if="${p.paginas() > 1}" class="paginacion-nav w-full sm:w-auto flex items-center justify-center sm:justify-end gap-2" aria-label="Paginación">
        <!-- Vista Móvil (<640px): Anterior / Página X de Y / Siguiente (sin scroll a 320px) -->
        <div class="flex sm:hidden items-center justify-between w-full max-w-full">
            <!-- Anterior Móvil -->
            <a th:if="${p.urlAnterior() != null}" th:href="${p.urlAnterior()}"
               class="btn s text-xs px-3 py-1.5 rounded-[10px] text-ink-2 border border-line bg-white hover:bg-pine-50 hover:text-pine-700 focus:outline-none focus:ring-2 focus:ring-pine-600 transition-colors"
               aria-label="Página anterior">Anterior</a>
            <span th:unless="${p.urlAnterior() != null}"
                  class="btn s text-xs px-3 py-1.5 rounded-[10px] text-ink-3 border border-line bg-slate-50 opacity-40 cursor-not-allowed select-none pointer-events-none"
                  aria-disabled="true">Anterior</span>

            <!-- Indicador Central Móvil -->
            <span class="text-xs text-ink-3 font-semibold px-2"
                  th:text="|Página ${p.pagina()} de ${p.paginas()}|">Página 1 de 10</span>

            <!-- Siguiente Móvil -->
            <a th:if="${p.urlSiguiente() != null}" th:href="${p.urlSiguiente()}"
               class="btn s text-xs px-3 py-1.5 rounded-[10px] text-ink-2 border border-line bg-white hover:bg-pine-50 hover:text-pine-700 focus:outline-none focus:ring-2 focus:ring-pine-600 transition-colors"
               aria-label="Página siguiente">Siguiente</a>
            <span th:unless="${p.urlSiguiente() != null}"
                  class="btn s text-xs px-3 py-1.5 rounded-[10px] text-ink-3 border border-line bg-slate-50 opacity-40 cursor-not-allowed select-none pointer-events-none"
                  aria-disabled="true">Siguiente</span>
        </div>

        <!-- Vista Escritorio (≥640px): Anterior, ventana compacta, Siguiente -->
        <div class="hidden sm:flex items-center justify-end gap-1.5 flex-wrap">
            <!-- Anterior Escritorio -->
            <a th:if="${p.urlAnterior() != null}" th:href="${p.urlAnterior()}"
               class="btn s text-xs px-3 py-1.5 rounded-[10px] text-ink-2 border border-line bg-white hover:bg-pine-50 hover:text-pine-700 focus:outline-none focus:ring-2 focus:ring-pine-600 transition-colors"
               aria-label="Página anterior">Anterior</a>
            <span th:unless="${p.urlAnterior() != null}"
                  class="btn s text-xs px-3 py-1.5 rounded-[10px] text-ink-3 border border-line bg-slate-50 opacity-40 cursor-not-allowed select-none pointer-events-none"
                  aria-disabled="true">Anterior</span>

            <!-- Números de página y separadores -->
            <th:block th:each="elem : ${p.elementos()}">
                <span th:if="${elem.esSeparador()}"
                      class="px-2 py-1 text-ink-3 text-xs select-none">…</span>

                <span th:if="${!elem.esSeparador() and elem.esActual()}"
                      class="inline-flex items-center justify-center min-w-[34px] h-[34px] px-3 text-xs font-bold rounded-[10px] bg-pine-50 text-pine-700 border border-pine-200"
                      aria-current="page"
                      th:text="${elem.texto()}">1</span>

                <a th:if="${!elem.esSeparador() and !elem.esActual()}"
                   th:href="${elem.url()}"
                   class="btn s inline-flex items-center justify-center min-w-[34px] h-[34px] px-3 text-xs font-semibold rounded-[10px] text-ink-2 border border-line bg-white hover:bg-pine-50 hover:text-pine-700 focus:outline-none focus:ring-2 focus:ring-pine-600 transition-colors"
                   th:text="${elem.texto()}"
                   th:attr="aria-label=|Ir a la página ${elem.numeroPagina()}|">2</a>
            </th:block>

            <!-- Siguiente Escritorio -->
            <a th:if="${p.urlSiguiente() != null}" th:href="${p.urlSiguiente()}"
               class="btn s text-xs px-3 py-1.5 rounded-[10px] text-ink-2 border border-line bg-white hover:bg-pine-50 hover:text-pine-700 focus:outline-none focus:ring-2 focus:ring-pine-600 transition-colors"
               aria-label="Página siguiente">Siguiente</a>
            <span th:unless="${p.urlSiguiente() != null}"
                  class="btn s text-xs px-3 py-1.5 rounded-[10px] text-ink-3 border border-line bg-slate-50 opacity-40 cursor-not-allowed select-none pointer-events-none"
                  aria-disabled="true">Siguiente</span>
        </div>
    </nav>
</div>

</body>
</html>
