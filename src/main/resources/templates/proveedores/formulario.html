<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${idProveedor != null
        ? 'Editar proveedor | Farmacia AED'
        : 'Nuevo proveedor | Farmacia AED'}">
        Proveedor | Farmacia AED
    </title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <main>
        <h1 th:text="${idProveedor != null
        ? 'Editar proveedor'
        : 'Nuevo proveedor'}">
            Proveedor
        </h1>

        <form th:action="${idProveedor != null}
          ? @{/proveedores/{id}/editar(id=${idProveedor})}
          : @{/proveedores}" th:object="${formulario}" method="post" class="formulario-medicamento">

            <div>
                <label for="ruc">RUC</label>
                <input type="text" id="ruc" th:field="*{ruc}" maxlength="11" inputmode="numeric" required>
                <p class="error" th:if="${#fields.hasErrors('ruc')}" th:errors="*{ruc}"></p>
            </div>

            <div>
                <label for="razonSocial">Razón social</label>
                <input type="text" id="razonSocial" th:field="*{razonSocial}" maxlength="150" required>
                <p class="error" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></p>
            </div>

            <div>
                <label for="telefono">Teléfono (opcional)</label>
                <input type="tel" id="telefono" th:field="*{telefono}" maxlength="20">
                <p class="error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p>
            </div>

            <div>
                <label for="correo">Correo (opcional)</label>
                <input type="email" id="correo" th:field="*{correo}" maxlength="150">
                <p class="error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></p>
            </div>

            <div>
                <label for="direccion">Dirección (opcional)</label>
                <input type="text" id="direccion" th:field="*{direccion}" maxlength="200">
                <p class="error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></p>
            </div>

            <button type="submit" th:text="${idProveedor != null
                ? 'Guardar cambios'
                : 'Guardar proveedor'}">
                Guardar
            </button>
            <a th:href="@{/proveedores}">Cancelar</a>
        </form>
    </main>
</body>

</html>
