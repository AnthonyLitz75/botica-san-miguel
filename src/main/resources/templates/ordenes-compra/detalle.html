<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de orden | Farmacia AED</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <main>
        <h1>Detalle de orden de compra</h1>

        <dl class="datos-movimiento">
            <dt>Número de orden</dt>
            <dd th:text="${orden.numeroOrden()}"></dd>
            <dt>Fecha y hora</dt>
            <dd th:text="${#temporals.format(
            orden.fechaHora(), 'dd/MM/yyyy HH:mm')}"></dd>
            <dt>Proveedor</dt>
            <dd th:text="${proveedor.razonSocial()}"></dd>
            <dt>Estado</dt>
            <dd th:text="${orden.estado()}"></dd>
            <dt>Total estimado (S/)</dt>
            <dd th:text="${#numbers.formatDecimal(
            orden.totalEstimado(), 1, 2, 'POINT')}"></dd>
            <dt>Observaciones</dt>
            <dd th:text="${orden.observaciones() == null
            ? 'Sin observaciones' : orden.observaciones()}"></dd>
        </dl>

        <p><a th:href="@{/ordenes-compra}">Volver a órdenes</a></p>

        <p th:if="${#lists.isEmpty(detalles)}">
            Esta orden no tiene medicamentos registrados.
        </p>
        <div class="tabla-contenedor" th:unless="${#lists.isEmpty(detalles)}">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Medicamento</th>
                        <th>Unidad</th>
                        <th>Cantidad solicitada</th>
                        <th>Costo unitario (S/)</th>
                        <th>Importe estimado (S/)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="detalle : ${detalles}">
                        <td th:text="${detalle.codigoMedicamento()}"></td>
                        <td th:text="${detalle.nombreMedicamento()}"></td>
                        <td th:text="${detalle.unidadControl()}"></td>
                        <td th:text="${detalle.cantidadSolicitada()}"></td>
                        <td th:text="${#numbers.formatDecimal(
                        detalle.costoUnitario(), 1, 2, 'POINT')}"></td>
                        <td th:text="${#numbers.formatDecimal(
                        detalle.importeEstimado(), 1, 2, 'POINT')}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
