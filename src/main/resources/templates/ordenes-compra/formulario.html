<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: recursos('Nueva orden de compra')}">
    <title>Nueva orden de compra | Botica San Miguel</title>
</head>

<body class="pagina-inventario">
    <a class="saltar-contenido" href="#contenido">Ir al contenido</a>
    <aside th:replace="~{fragmentos/navegacion :: lateral('Órdenes de compra')}"></aside>
    <div class="inventario-area">
        <header th:replace="~{fragmentos/navegacion :: cabecera('Órdenes de compra', 'Compras')}"></header>
        <main id="contenido" class="inventario-contenido">

            <div class="inventario-titulo">
                <div>
                    <p class="seccion-etiqueta">COMPRAS / SOLICITUD DE ABASTECIMIENTO</p>
                    <h1>Nueva orden de compra</h1>
                </div>
                <a class="inventario-boton boton-secundario" th:href="@{/ordenes-compra}">
                    <span class="icono icono-arrow-left" aria-hidden="true"></span>Volver a órdenes
                </a>
            </div>

            <form th:action="@{/ordenes-compra}" method="post" th:object="${formulario}"
                class="proveedor-formulario orden-formulario">

                <div class="aviso-operacion aviso-error" th:if="${#fields.hasAnyErrors()}" role="alert">
                    <span class="icono icono-x" aria-hidden="true"></span>
                    <div>
                        <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
                    </div>
                </div>

                <fieldset>
                    <legend>Datos del proveedor</legend>
                    <div class="proveedor-campos">
                        <div class="campo-completo">
                            <label for="idProveedor">Razón social del proveedor activo</label>
                            <select id="idProveedor" th:field="*{idProveedor}" required
                                th:attr="aria-invalid=${#fields.hasErrors('idProveedor')},aria-describedby=${#fields.hasErrors('idProveedor') ? 'error-idProveedor' : null}">
                                <option value="">Seleccionar proveedor</option>
                                <option th:each="proveedor : ${proveedores}" th:value="${proveedor.idProveedor()}"
                                    th:text="${proveedor.razonSocial()}"></option>
                            </select>
                            <p class="error" id="error-idProveedor" th:if="${#fields.hasErrors('idProveedor')}"
                                th:errors="*{idProveedor}"></p>
                            <span class="campo-ayuda">La orden se generará en estado PENDIENTE y no modificará el stock
                                hasta su recepción.</span>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Detalle del medicamento solicitado</legend>
                    <div class="proveedor-campos">
                        <div class="campo-completo">
                            <label for="medicamento">Medicamento</label>
                            <select id="medicamento" th:field="*{detalles[0].idMedicamento}" required
                                th:attr="aria-invalid=${#fields.hasErrors('detalles[0].idMedicamento')},aria-describedby=${#fields.hasErrors('detalles[0].idMedicamento') ? 'error-medicamento' : null}">
                                <option value="">Seleccionar medicamento del catálogo</option>
                                <option th:each="medicamento : ${medicamentos}"
                                    th:value="${medicamento.idMedicamento()}"
                                    th:text="${medicamento.codigo() + ' — ' + medicamento.nombre()}"></option>
                            </select>
                            <p class="error" id="error-medicamento" th:if="${#fields.hasErrors('detalles[0].idMedicamento')}"
                                th:errors="*{detalles[0].idMedicamento}"></p>
                        </div>
                        <div>
                            <label for="cantidad">Cantidad solicitada</label>
                            <input id="cantidad" type="number" min="1" step="1" placeholder="Ej. 20"
                                th:field="*{detalles[0].cantidadSolicitada}" required
                                th:attr="aria-invalid=${#fields.hasErrors('detalles[0].cantidadSolicitada')},aria-describedby=${#fields.hasErrors('detalles[0].cantidadSolicitada') ? 'error-cantidad' : null}">
                            <p class="error" id="error-cantidad" th:if="${#fields.hasErrors('detalles[0].cantidadSolicitada')}"
                                th:errors="*{detalles[0].cantidadSolicitada}"></p>
                        </div>
                        <div>
                            <label for="costo">Costo unitario acordado (S/)</label>
                            <input id="costo" type="number" min="0" step="0.01" placeholder="0.00"
                                th:field="*{detalles[0].costoUnitario}" required
                                th:attr="aria-invalid=${#fields.hasErrors('detalles[0].costoUnitario')},aria-describedby=${#fields.hasErrors('detalles[0].costoUnitario') ? 'error-costo' : null}">
                            <p class="error" id="error-costo" th:if="${#fields.hasErrors('detalles[0].costoUnitario')}"
                                th:errors="*{detalles[0].costoUnitario}"></p>
                        </div>
                        <div class="campo-completo orden-calculo-previo">
                            <span>Importe estimado de la orden:</span>
                            <strong id="importe-previo">S/ 0.00</strong>
                        </div>
                        <div class="campo-completo">
                            <label for="observaciones">Observaciones <span
                                    class="campo-opcional">(opcional)</span></label>
                            <textarea id="observaciones" th:field="*{observaciones}" maxlength="500" rows="3"
                                placeholder="Condiciones de entrega, plazo acordado o notas para almacén..."></textarea>
                        </div>
                    </div>
                </fieldset>

                <div class="proveedor-formulario-acciones">
                    <button class="inventario-boton boton-principal transition-all duration-150 active:scale-95 hover:shadow-md" type="submit">
                        <span class="icono icono-save" aria-hidden="true"></span>Guardar orden
                    </button>
                    <a class="inventario-boton boton-secundario transition-all duration-150 active:scale-95" th:href="@{/ordenes-compra}">
                        <span class="icono icono-x" aria-hidden="true"></span>Cancelar
                    </a>
                </div>
            </form>
        </main>
    </div>

    <script th:src="@{/js/formularios.js}" defer></script>
    <script>
        const inputCantidad = document.getElementById("cantidad");
        const inputCosto = document.getElementById("costo");
        const importePrevio = document.getElementById("importe-previo");

        function actualizarImporteEstimado() {
            const cant = Number.parseFloat(inputCantidad.value) || 0;
            const costo = Number.parseFloat(inputCosto.value) || 0;
            const total = cant >= 0 && costo >= 0 ? cant * costo : 0;
            importePrevio.textContent = "S/ " + total.toFixed(2);
        }

        inputCantidad.addEventListener("input", actualizarImporteEstimado);
        inputCosto.addEventListener("input", actualizarImporteEstimado);
        actualizarImporteEstimado();
    </script>
</body>

</html>
