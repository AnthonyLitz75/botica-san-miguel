<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Botica San Miguel</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/inventario.css}">
</head>

<body class="pagina-login">
    <main class="login-principal">
        <section class="login-panel" aria-labelledby="titulo-login">
            <div class="login-identidad">
                <div class="login-emblema-caja">
                    <img th:src="@{/images/logo-botica-san-miguel.png}" alt="Logo Botica San Miguel"
                        class="login-emblema" width="76" height="76">
                </div>
                <p class="login-etiqueta">PORTAL INTERNO</p>
                <h1 id="titulo-login">Botica San Miguel</h1>
                <h2>Gestión de inventario y compras</h2>
            </div>

            <p th:if="${param.error}" class="login-aviso login-aviso-error" role="alert">
                <span class="icono icono-x" aria-hidden="true"></span>
                <span>Usuario o contraseña incorrectos.</span>
            </p>

            <p th:if="${param.logout}" class="login-aviso login-aviso-exito" role="status">
                <span class="icono icono-circle-check" aria-hidden="true"></span>
                <span>Cerraste sesión correctamente.</span>
            </p>

            <form th:action="@{/login}" method="post" class="login-formulario">
                <div class="login-campo">
                    <label for="username">Usuario</label>
                    <div class="login-input-grupo">
                        <span class="icono icono-user-round" aria-hidden="true"></span>
                        <input type="text" id="username" name="username" autocomplete="username" maxlength="50"
                            placeholder="Ingresa tu usuario" required autofocus>
                    </div>
                </div>

                <div class="login-campo">
                    <label for="password">Contraseña</label>
                    <div class="login-input-grupo">
                        <svg class="icono-svg-input" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input type="password" id="password" name="password" autocomplete="current-password"
                            placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>

                <label class="login-mostrar-clave">
                    <input type="checkbox" id="mostrar-password">
                    <span>Mostrar contraseña</span>
                </label>

                <button type="submit" class="login-boton">
                    Iniciar sesión
                </button>
            </form>

            <footer class="login-pie">
                <span>Acceso exclusivo para personal autorizado</span>
            </footer>
        </section>
    </main>

    <script>
        const mostrarPassword = document.getElementById("mostrar-password");
        const password = document.getElementById("password");

        mostrarPassword.addEventListener("change", () => {
            password.type = mostrarPassword.checked ? "text" : "password";
        });
    </script>
</body>

</html>
