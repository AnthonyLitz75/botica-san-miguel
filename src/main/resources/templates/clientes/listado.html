<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: recursos('Clientes')}">
    <title>Clientes | Botica San Miguel</title>
</head>
<body class="pagina-inventario">
    <a class="saltar-contenido" href="#contenido">Ir al contenido</a>
    <aside th:replace="~{fragmentos/navegacion :: lateral('Clientes')}"></aside>
    <div class="inventario-area">
        <header th:replace="~{fragmentos/navegacion :: cabecera('Clientes', 'Atención al cliente')}"></header>
        <main id="contenido" class="inventario-contenido">
            <div class="inventario-titulo"><div><p class="seccion-etiqueta">VENTAS / DIRECTORIO</p><h1>Clientes</h1>
                <p class="clientes-intro">Consulta y mantén los datos de identificación y contacto.</p></div>
                <a class="inventario-boton boton-principal transition-all duration-150 active:scale-95 hover:shadow-md" th:href="@{/clientes/nuevo}"><span class="icono icono-plus" aria-hidden="true"></span>Nuevo cliente</a>
            </div>

            <div class="aviso-operacion aviso-exito shadow-sm" th:if="${mensaje != null}" role="status"><span class="icono icono-circle-check" aria-hidden="true"></span><span th:text="${mensaje}"></span></div>

            <form class="inventario-filtros clientes-filtros" th:action="@{/clientes}" method="get" role="search">
                <div class="filtro-busqueda"><label for="buscar">Buscar por documento o nombre</label><div class="entrada-busqueda focus-within:ring-2 focus-within:ring-emerald-600/30 transition-all duration-150">
                    <span class="icono icono-search" aria-hidden="true"></span><input type="search" id="buscar" name="buscar" th:value="${buscar}" maxlength="150" placeholder="DNI, RUC o nombre del cliente">
                </div></div>
                <div class="filtro-acciones"><button class="inventario-boton boton-principal transition-all duration-150 active:scale-95" type="submit"><span class="icono icono-search" aria-hidden="true"></span>Buscar</button>
                    <a class="inventario-boton boton-secundario transition-all duration-150 active:scale-95" th:href="@{/clientes}"><span class="icono icono-x" aria-hidden="true"></span>Limpiar</a></div>
            </form>

            <section class="inventario-resultados" aria-labelledby="titulo-clientes">
                <div class="resultados-cabecera"><h2 id="titulo-clientes">Listado de clientes <span class="cantidad-resultados" th:text="${#lists.size(clientes)}">0</span></h2></div>
                <div class="inventario-vacio" th:if="${#lists.isEmpty(clientes)}"><span class="icono icono-user-round" aria-hidden="true"></span>
                    <p th:text="${#strings.isEmpty(buscar) ? 'Aún no hay clientes registrados.' : 'No se encontraron clientes para esta búsqueda.'}">Sin resultados.</p>
                    <a th:if="${#strings.isEmpty(buscar)}" class="enlace-lotes inline-flex items-center gap-1 font-medium text-emerald-700 hover:text-emerald-800 transition-colors" th:href="@{/clientes/nuevo}">Registrar primer cliente</a>
                </div>
                <div class="tabla-contenedor inventario-tabla tabla-clientes" th:unless="${#lists.isEmpty(clientes)}" role="region" aria-label="Clientes, tabla desplazable">
                    <table><thead><tr><th scope="col">Documento</th><th scope="col">Nombre completo</th><th scope="col">Teléfono</th><th scope="col">Correo</th><th scope="col">Acciones</th></tr></thead>
                    <tbody><tr th:each="cliente : ${clientes}" class="hover:bg-slate-50/80 transition-colors duration-150">
                        <td><span class="cliente-tipo-documento inline-block px-1.5 py-0.5 rounded text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 mr-1.5" th:text="${cliente.tipoDocumento()}">DNI</span><span class="codigo-medicamento" th:text="${cliente.numeroDocumento()}">00000000</span></td>
                        <td class="nombre-medicamento" th:text="${cliente.nombreCompleto()}">Nombre</td>
                        <td th:text="${#strings.isEmpty(cliente.telefono()) ? '—' : cliente.telefono()}">—</td>
                        <td class="contacto-proveedor" th:text="${#strings.isEmpty(cliente.correo()) ? '—' : cliente.correo()}">—</td>
                        <td><a class="boton-icono transition-transform duration-150 hover:scale-110 hover:text-emerald-700" th:href="@{/clientes/{id}/editar(id=${cliente.idCliente()})}" title="Editar cliente" th:attr="aria-label=${'Editar ' + cliente.nombreCompleto()}"><span class="icono icono-pencil" aria-hidden="true"></span></a></td>
                    </tr></tbody></table>
                </div>
                <p class="resultados-pie text-xs text-slate-500" th:text="${#lists.size(clientes)} + (${#lists.size(clientes) == 1} ? ' cliente encontrado' : ' clientes encontrados')">0 clientes encontrados</p>
            </section>
        </main>
    </div>
</body>
</html>
