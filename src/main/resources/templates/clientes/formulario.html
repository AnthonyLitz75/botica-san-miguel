<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: recursos(${idCliente != null ? 'Editar cliente' : 'Nuevo cliente'})}">
    <title th:text="${idCliente != null ? 'Editar cliente | Botica San Miguel' : 'Nuevo cliente | Botica San Miguel'}">Cliente | Botica San Miguel</title>
</head>
<body class="pagina-inventario">
    <a class="saltar-contenido" href="#contenido">Ir al contenido</a>
    <aside th:replace="~{fragmentos/navegacion :: lateral('Clientes')}"></aside>
    <div class="inventario-area">
        <header th:replace="~{fragmentos/navegacion :: cabecera('Clientes', 'Atención al cliente')}"></header>
        <main id="contenido" class="inventario-contenido">
            <div class="inventario-titulo"><div><p class="seccion-etiqueta">VENTAS / DIRECTORIO DE CLIENTES</p>
                <h1 th:text="${idCliente != null ? 'Editar cliente' : 'Nuevo cliente'}">Cliente</h1></div>
                <a class="inventario-boton boton-secundario" th:href="@{/clientes}"><span class="icono icono-arrow-left" aria-hidden="true"></span>Volver a clientes</a>
            </div>

            <form th:action="${idCliente != null} ? @{/clientes/{id}/editar(id=${idCliente})} : @{/clientes}" th:object="${formulario}" method="post" class="proveedor-formulario cliente-formulario">
                <div class="aviso-operacion aviso-error" th:if="${#fields.hasGlobalErrors()}" role="alert"><span class="icono icono-x" aria-hidden="true"></span>
                    <div><p th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</p></div>
                </div>
                <fieldset><legend>Identificación del cliente</legend><div class="proveedor-campos cliente-campos">
                    <div><label for="tipoDocumento">Tipo de documento</label>
                        <select id="tipoDocumento" th:field="*{tipoDocumento}" required th:attr="aria-invalid=${#fields.hasErrors('tipoDocumento')},aria-describedby=${#fields.hasErrors('tipoDocumento') ? 'error-tipo' : null}">
                            <option value="DNI">DNI</option><option value="RUC">RUC</option>
                        </select><p class="error" id="error-tipo" th:if="${#fields.hasErrors('tipoDocumento')}" th:errors="*{tipoDocumento}"></p>
                    </div>
                    <div><label for="numeroDocumento">Número de documento</label>
                        <input id="numeroDocumento" type="text" th:field="*{numeroDocumento}" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="8 dígitos para DNI o 11 para RUC" required th:attr="aria-invalid=${#fields.hasErrors('numeroDocumento')},aria-describedby=${#fields.hasErrors('numeroDocumento') ? 'error-documento' : null}">
                        <span class="campo-ayuda" id="ayuda-documento">DNI: 8 dígitos. RUC: 11 dígitos.</span><p class="error" id="error-documento" th:if="${#fields.hasErrors('numeroDocumento')}" th:errors="*{numeroDocumento}"></p>
                    </div>
                    <div class="campo-completo"><label for="nombreCompleto">Nombre completo o razón social</label>
                        <input id="nombreCompleto" type="text" th:field="*{nombreCompleto}" maxlength="150" autocomplete="name" placeholder="Nombre y apellidos o razón social" required th:attr="aria-invalid=${#fields.hasErrors('nombreCompleto')},aria-describedby=${#fields.hasErrors('nombreCompleto') ? 'error-nombre' : null}">
                        <p class="error" id="error-nombre" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></p>
                    </div>
                </div></fieldset>

                <fieldset><legend>Datos de contacto <span class="campo-opcional">(opcionales)</span></legend><div class="proveedor-campos">
                    <div><label for="telefono">Teléfono</label><input id="telefono" type="tel" th:field="*{telefono}" maxlength="20" autocomplete="tel" placeholder="Ej. 987 654 321" th:attr="aria-invalid=${#fields.hasErrors('telefono')},aria-describedby=${#fields.hasErrors('telefono') ? 'error-telefono' : null}"><p class="error" id="error-telefono" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p></div>
                    <div><label for="correo">Correo electrónico</label><input id="correo" type="email" th:field="*{correo}" maxlength="150" autocomplete="email" placeholder="cliente@correo.com" th:attr="aria-invalid=${#fields.hasErrors('correo')},aria-describedby=${#fields.hasErrors('correo') ? 'error-correo' : null}"><p class="error" id="error-correo" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></p></div>
                </div></fieldset>

                <div class="proveedor-formulario-acciones"><button type="submit" class="inventario-boton boton-principal transition-all duration-150 active:scale-95 hover:shadow-md"><span class="icono icono-save" aria-hidden="true"></span><span th:text="${idCliente != null ? 'Guardar cambios' : 'Guardar cliente'}">Guardar</span></button>
                    <a class="inventario-boton boton-secundario transition-all duration-150 active:scale-95" th:href="@{/clientes}"><span class="icono icono-x" aria-hidden="true"></span>Cancelar</a>
                </div>
            </form>
        </main>
    </div>
    <script th:src="@{/js/formularios.js}" defer></script>
</body>
</html>
