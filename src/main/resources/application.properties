spring.application.name=farmacia-aed

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/farmacia_aed}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway: el esquema se crea y actualiza con src/main/resources/db/migration (V1__, V2__, ...).
# Una base creada antes con scripts manuales (sin tabla flyway_schema_history) se marca como V1
# y solo recibe las migraciones posteriores.
spring.flyway.locations=classpath:db/migration

# Horizonte (en dias) de la alerta "por vencer" en /alertas y /api/alertas/por-vencer.
farmacia.alertas.dias-por-vencer=${DIAS_POR_VENCER:90}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema creado con scripts manuales


# Errores (spec 013): páginas propias en templates/error/ y nunca detalles internos en la respuesta.
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
